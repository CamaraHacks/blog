name: GH Pages Deploy

on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup Marmite 🫙
        run: |
          curl -L -o marmite.tar.gz https://github.com/rochacbruno/marmite/releases/latest/download/marmite-x86_64-unknown-linux-musl.tar.gz
          tar -xzf marmite.tar.gz
          sudo mv marmite /usr/local/bin/
          rm marmite.tar.gz

      - name: Clean and Build site 🏗️
        run: |
          rm -rf site
          marmite . site -vv

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
